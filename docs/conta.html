<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha conta · PortFlix</title>
<meta name="description" content="Entre com o Google para comprar o PortFlix PRO e ver as suas chaves.">
<meta name="robots" content="noindex">
<link rel="icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="./"><img src="icone.png" alt=""><span>PORT<b>FLIX</b></span></a>
  <nav class="links"><a href="./">Página inicial</a><a class="lang" href="en/account.html" hreflang="en" title="English">🇺🇸 EN</a><a href="./#precos">Preços</a><a id="sair" href="#" hidden>Sair</a></nav>
</div></header>

<main class="wrap">
  <div class="box" id="app"><p><span class="spin"></span>Carregando…</p></div>
  <p class="small" style="text-align:center;margin-bottom:40px">Dúvidas? <a href="https://wa.me/5548988516188" target="_blank" rel="noopener">WhatsApp (48) 98851-6188</a> · <a href="mailto:hugofernandes30@gmail.com">hugofernandes30@gmail.com</a></p>
</main>

<script>
const API = "https://portsradar-licencas.portsradar-hugo.workers.dev";
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
let PUB = {}, ID = "", ME = null;
const store = { get(){ try { return sessionStorage.getItem("pf_id") || ""; } catch { return ""; } }, set(v){ try { v ? sessionStorage.setItem("pf_id", v) : sessionStorage.removeItem("pf_id"); } catch {} } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WA = "https://wa.me/5548988516188";
const waLink = email => WA + "?text=" + encodeURIComponent("Olá! Quero comprar o PortFlix PRO vitalício pagando com Pix. Plano: (1 PC R$ 30 / 2 PCs R$ 50). Meu e-mail do PortFlix é: " + (email || ""));
const PLANS = () => (ME && ME.plans) || PUB.plans || [{ pcs: 1, price: 30 }, { pcs: 2, price: 50 }];
const brl = n => Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

async function api(path, opt = {}) {
  const r = await fetch(API + path, { ...opt, headers: { "content-type": "application/json", ...(ID ? { authorization: "Bearer " + ID } : {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { ID = ""; store.set(""); }
  if (!r.ok) throw new Error(j.message || "Erro " + r.status);
  return j;
}
function view(html) { $("#app").innerHTML = html; }

async function start() {
  try { PUB = await api("/v1/public"); } catch { view(`<h1>Minha conta</h1><div class="msg bad">Não foi possível falar com o servidor. Tente de novo em instantes.</div>`); return; }
  ID = store.get();
  if (ID) { try { ME = await api("/v1/web/me"); } catch { ME = null; } }
  ME ? logged() : login();
}

function login() {
  $("#sair").hidden = true;
  view(`<h1>Minha conta</h1>
    <p class="small">Entre com o Google para comprar o PRO e ver as suas chaves.</p>
    <div class="msg" style="border-color:var(--acc)"><b>⚠️ Atenção ao e-mail</b><br>Entre com o <b>mesmo e-mail</b> que você vai usar no aplicativo PortFlix. A chave do PRO fica presa a esse e-mail: na hora de ativar, o app só aceita se você entrar com ele.</div>
    <div id="gbtn" style="margin:22px 0"></div>
    <p class="small">Só usamos o seu nome e e-mail. <a href="${API}/privacidade">Privacidade</a></p>`);
  if (!PUB.webClientId) { $("#gbtn").innerHTML = `<div class="msg">O login pelo site está sendo ligado. Enquanto isso, compre pelo <a href="${WA}" target="_blank" rel="noopener">WhatsApp (48) 98851-6188</a> ou pelo e-mail <a href="mailto:hugofernandes30@gmail.com">hugofernandes30@gmail.com</a>.</div>`; return; }
  const go = () => {
    if (!window.google?.accounts?.id) return setTimeout(go, 150);
    google.accounts.id.initialize({ client_id: PUB.webClientId, callback: onGoogle, ux_mode: "popup" });
    google.accounts.id.renderButton($("#gbtn"), { theme: "filled_black", size: "large", shape: "pill", text: "signin_with", locale: "pt-BR" });
  };
  go();
}

async function onGoogle(res) {
  try {
    const j = await api("/v1/web/google", { method: "POST", body: JSON.stringify({ credential: res.credential }) });
    ID = j.identity; store.set(ID);
    ME = await api("/v1/web/me");
    logged();
  } catch (e) { alert(e.message); }
}

function keyHtml(k) {
  const st = k.status === "active" ? (k.activated ? `ativa · ${k.devices}/${k.maxDevices} PCs` : "pronta para ativar") : k.status === "revoked" ? "cancelada" : "vencida";
  return `<div class="keyrow"><code>${esc(k.key)}</code><button class="btn sm" onclick="copy('${esc(k.key)}',this)">Copiar</button><span class="st">${k.lifetime ? "Vitalícia · " : ""}${st}</span></div>`;
}
window.copy = (t, b) => { navigator.clipboard?.writeText(t).then(() => { b.textContent = "Copiado!"; setTimeout(() => b.textContent = "Copiar", 1500); }); };

const HOW = `<h3 style="margin-top:26px">Como ativar</h3><ol class="steps">
  <li>Baixe e abra o PortFlix (<a href="./#baixar">download</a>).</li>
  <li>Clique em <b>Ativar PRO</b>, no canto de cima.</li>
  <li>Entre com <b>esta mesma conta Google</b>.</li>
  <li>Cole a chave e clique em <b>Ativar</b>.</li></ol>`;

function logged() {
  $("#sair").hidden = false;
  const w = ME.who, ks = ME.keys || [];
  const active = ks.some(k => k.status === "active");
  view(`<h1>Minha conta</h1>
    <div class="who">${w.pic ? `<img src="${esc(w.pic)}" alt="" referrerpolicy="no-referrer">` : ""}<div><b>${esc(w.name || w.email)}</b><div class="small" style="margin:0">${esc(w.email)}</div></div></div>
    <div id="pedido"></div>
    <h3>Suas chaves</h3>
    ${ks.length ? ks.map(keyHtml).join("") : `<p class="small">Você ainda não tem chaves do PRO.</p>`}
    ${active ? HOW : ""}
    <div class="plan pro" style="margin-top:26px">
      <h3>PortFlix PRO vitalício</h3><div class="small">Pagamento único · Pix, cartão ou boleto</div>
      <div class="plans2">${PLANS().map((p, i) => `<label class="opt"><input type="radio" name="pcs" value="${p.pcs}" ${Number(q.get("pcs") || 1) === p.pcs ? "checked" : ""}><span><b>${p.pcs} ${p.pcs > 1 ? "PCs" : "PC"}</b><em>${brl(p.price)}</em></span></label>`).join("")}</div>
      <div class="msg" style="border-color:var(--acc)">A chave será criada para o e-mail <b>${esc(w.email)}</b>. No aplicativo, entre com <b>esse mesmo e-mail</b> para ativar. Se for usar outro, clique em <b>Sair</b> e entre com ele antes de comprar.</div>
      <div class="cta" style="justify-content:flex-start;margin-top:18px">${ME.buyOnline ? `<button class="btn pri" id="buy">${active ? "Comprar outra chave" : "Comprar agora"}</button>` : ""}<a class="btn wa" href="${waLink(w.email)}" target="_blank" rel="noopener">💬 Pix pelo WhatsApp</a></div>
      <p class="small">${ME.buyOnline ? "<b>Comprar agora:</b> Mercado Pago (Pix, cartão ou boleto), a chave aparece aqui na hora.<br>" : ""}<b>Pix pelo WhatsApp:</b> você recebe a chave Pix, manda o comprovante e a sua chave do PRO aparece aqui nesta página.</p>
    </div>`);
  if ($("#buy")) $("#buy").onclick = buy;
  if (q.get("pedido")) watchOrder(q.get("pedido"));
}

async function buy() {
  const b = $("#buy"); b.disabled = true; b.innerHTML = `<span class="spin"></span>Abrindo o Mercado Pago…`;
  const pcs = Number(document.querySelector('input[name=pcs]:checked')?.value || 1);
  try { const j = await api("/v1/web/checkout", { method: "POST", body: JSON.stringify({ pcs }) }); location.href = j.url; }
  catch (e) { b.disabled = false; b.textContent = "Comprar agora"; alert(e.message); }
}

async function watchOrder(id) {
  const box = $("#pedido");
  for (let i = 0; i < 60; i++) {
    let o;
    try { o = await api("/v1/web/order?id=" + encodeURIComponent(id)); } catch (e) { box.innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; return; }
    if (o.key) {
      history.replaceState(null, "", "conta.html");
      ME = await api("/v1/web/me"); logged();
      $("#pedido").innerHTML = `<div class="msg ok"><b>Pagamento aprovado! 🎉</b> Sua chave já está abaixo.</div>`;
      return;
    }
    if (["rejected", "cancelled", "valor_errado"].includes(o.status)) { box.innerHTML = `<div class="msg bad">O pagamento não foi aprovado. Você pode tentar de novo.</div>`; return; }
    box.innerHTML = `<div class="msg"><span class="spin"></span>${o.status === "pending" || o.status === "in_process" ? "Aguardando a confirmação do pagamento. No Pix e no cartão é rapidinho; no boleto pode levar até 3 dias úteis." : "Confirmando o pagamento…"}</div>`;
    await new Promise(r => setTimeout(r, i < 20 ? 3000 : 10000));
  }
}

$("#sair").onclick = e => { e.preventDefault(); store.set(""); ID = ""; ME = null; try { google.accounts.id.disableAutoSelect(); } catch {} login(); };
start();
</script>
</body>
</html>
